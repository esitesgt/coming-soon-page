<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05060b"><meta name="description" content="کارت ویزیت دیجیتال اسماعیل میرزایی"><title>اسماعیل میرزایی — Digital Business Card</title><style>body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#14233a,#05060b 55%);color:#fff;font-family:Tahoma,Arial,sans-serif;display:grid;place-items:center}.wrap{width:min(920px,92vw);text-align:center;padding:28px}.badge{display:inline-block;padding:8px 14px;border:1px solid #ffffff22;border-radius:999px;color:#71f0c2;font-size:11px;background:#ffffff08}.card{margin:24px auto 16px;max-width:760px;aspect-ratio:1.72/1;position:relative;transform-style:preserve-3d;transition:transform .8s ease;cursor:pointer}.card.flip{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:30px;border:1px solid #ffffff20;overflow:hidden;box-shadow:0 30px 80px #0009;background:linear-gradient(135deg,#101a28,#090c14 55%,#15122a)}.front{padding:38px;box-sizing:border-box;text-align:right}.glow{position:absolute;inset:-40%;background:conic-gradient(from 90deg,transparent,#62e5ff22,transparent,#9b7cff22,transparent);animation:r 12s linear infinite}@keyframes r{to{transform:rotate(360deg)}}.inner{position:relative;height:100%;display:flex;flex-direction:column;justify-content:space-between}.brand{font-size:11px;letter-spacing:4px;color:#aebbd0}.name{font-size:clamp(38px,7vw,68px);line-height:1;font-weight:900;margin:0;background:linear-gradient(90deg,#fff,#b9f4ff,#c9bbff);color:transparent;background-clip:text}.role{color:#d2d9e7;margin-top:14px}.meta{font-size:9px;color:#68758b;letter-spacing:2px}.chip{width:76px;height:50px;border-radius:11px;background:linear-gradient(145deg,#ddd39b,#70683f);opacity:.8;box-shadow:inset 0 1px 4px #fff9;position:absolute;left:0;bottom:0}.back{transform:rotateY(180deg);padding:30px;box-sizing:border-box}.backinner{height:100%;display:grid;grid-template-columns:1fr 180px;gap:25px;text-align:right}.title{font-size:22px;margin:0 0 16px}.contact{display:block;text-decoration:none;color:#fff;border:1px solid #ffffff14;background:#ffffff08;padding:11px 14px;border-radius:14px;margin:8px 0}.contact small{display:block;color:#8794a9;margin-top:4px;direction:ltr;text-align:right}.qr{display:grid;place-items:center}.qr img{width:150px;height:150px;background:#fff;padding:10px;border-radius:18px}.buttons{display:flex;justify-content:center;gap:10px}.btn{border:1px solid #ffffff18;background:#ffffff09;color:#fff;border-radius:13px;padding:11px 18px;cursor:pointer}@media(max-width:600px){.front{padding:24px}.back{padding:20px}.backinner{grid-template-columns:1fr 105px;gap:10px}.qr img{width:82px;height:82px}.name{font-size:32px}.chip{width:50px;height:34px}}</style></head><body><main class="wrap"><div class="badge">● DIGITAL IDENTITY · ONLINE</div><div class="card" id="card" tabindex="0" role="button"><section class="face front"><div class="glow"></div><div class="inner"><div><div class="brand">ISMAIL MIRZAEI · DIGITAL CARD</div><div style="height:55%"></div><h1 class="name">اسماعیل<br>میرزایی</h1><div class="role">مهندس کامپیوتر</div></div><div class="meta">DESIGN · CODE · DIGITAL</div><div class="chip"></div></div></section><section class="face back"><div class="backinner"><div><h2 class="title">اطلاعات تماس</h2><a class="contact" href="tel:+989366811214">☎ تلفن<small>0936 681 1214</small></a><a class="contact" href="mailto:esimirzai29@gmail.com">✉ ایمیل<small>esimirzai29@gmail.com</small></a><a class="contact" href="https://instagram.com/esimirzaei" target="_blank" rel="noopener">◎ اینستاگرام<small>@esimirzaei</small></a><p style="color:#718097;font-size:9px;line-height:2">برای چرخاندن کارت روی آن کلیک کنید.</p></div><div class="qr"><img id="qr" alt="QR Code"></div></div></section></div><div class="buttons"><button class="btn" id="flip">چرخاندن کارت</button><button class="btn" id="save">ذخیره مخاطب</button></div></main><script>const card=document.getElementById('card');const flip=()=>card.classList.toggle('flip');card.addEventListener('click',e=>{if(!e.target.closest('a,button'))flip()});document.getElementById('flip').onclick=flip;card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}});const vcard=['BEGIN:VCARD','VERSION:3.0','FN:اسماعیل میرزایی','TITLE:مهندس کامپیوتر','TEL;TYPE=CELL:+989366811214','EMAIL:esimirzai29@gmail.com','URL:https://instagram.com/esimirzaei','END:VCARD'].join('\n');document.getElementById('qr').src='https://api.qrserver.com/v1/create-qr-code/?size=220x220&data='+encodeURIComponent(vcard);document.getElementById('save').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([vcard],{type:'text/vcard;charset=utf-8'}));a.download='Ismail-Mirzaei.vcf';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};</script></body></html>
