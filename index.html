:root{font-family:'Vazirmatn',Tahoma,sans-serif;color:#fff;background:#09090f;color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#09090f}body{min-height:100vh;overflow-x:hidden}.page{min-height:100vh;display:grid;place-items:center;padding:28px 18px;position:relative;isolation:isolate;background:radial-gradient(circle at 50% -10%,rgba(99,102,241,.18),transparent 35%),radial-gradient(circle at 10% 90%,rgba(45,212,191,.08),transparent 30%)}.grid{position:fixed;inset:0;z-index:-1;opacity:.28;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(circle at center,black,transparent 75%)}.card{width:min(470px,100%);border:1px solid rgba(255,255,255,.1);border-radius:30px;background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.025));box-shadow:0 35px 100px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(24px);overflow:hidden}.cover{height:125px;background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 45%,#2dd4bf 130%);position:relative}.cover:after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 75% 20%,rgba(255,255,255,.3),transparent 25%),linear-gradient(120deg,transparent 25%,rgba(255,255,255,.08) 25%,transparent 26%);opacity:.7}.body{padding:0 28px 28px}.avatar{width:104px;height:104px;margin-top:-52px;border:5px solid #101018;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#24243a,#11111c);font-size:31px;font-weight:900;position:relative;z-index:2;box-shadow:0 15px 35px rgba(0,0,0,.35)}.avatar span{background:linear-gradient(135deg,#fff,#b7f7e9);-webkit-background-clip:text;color:transparent}.name{margin:18px 0 3px;font-size:30px;letter-spacing:-1.2px;font-weight:900}.role{color:#9fa6bb;font-size:14px}.bio{margin:20px 0;color:#b9bfd0;font-size:13px;line-height:2;text-align:right}.links{display:grid;gap:10px}.link{display:flex;align-items:center;gap:13px;padding:13px 14px;border:1px solid rgba(255,255,255,.08);border-radius:15px;background:rgba(255,255,255,.035);color:#fff;text-decoration:none;transition:.22s}.link:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.17);background:rgba(255,255,255,.06)}.icon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.07);font-size:15px;color:#dfe3ef}.link b{font-size:12px;font-weight:700}.link small{display:block;color:#777f96;font-size:10px;margin-top:2px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.action{padding:13px;border-radius:14px;text-align:center;text-decoration:none;font-family:inherit;font-size:12px;font-weight:800}.primary{background:#fff;color:#0b0b12}.secondary{border:1px solid rgba(255,255,255,.1);color:#d9dcea;background:rgba(255,255,255,.03)}.footer{display:flex;justify-content:space-between;align-items:center;margin-top:22px;color:#62697d;font-size:9px}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#5eead4;box-shadow:0 0 10px #5eead4;margin-left:5px}@media(max-width:480px){.card{border-radius:25px}.body{padding:0 20px 22px}.name{font-size:27px}.cover{height:110px}.avatar{width:94px;height:94px;margin-top:-47px}.bio{font-size:12px}}
