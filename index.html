<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="این وب‌سایت به‌زودی راه‌اندازی می‌شود.">
<meta name="theme-color" content="#080b16">
<title>به‌زودی — در دست ساخت</title>
<style>
:root{color-scheme:dark;font-family:Tahoma,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080b16;color:#f7f8ff;overflow:hidden}.page{position:relative;min-height:100vh;display:grid;place-items:center;padding:32px}.glow{position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(111,92,255,.28),transparent 68%);filter:blur(10px);top:8%;right:12%}.glow.two{width:360px;height:360px;top:auto;right:auto;bottom:-8%;left:8%;background:radial-gradient(circle,rgba(41,211,180,.16),transparent 68%)}.card{position:relative;width:min(720px,100%);padding:64px 48px;text-align:center;border:1px solid rgba(255,255,255,.1);border-radius:28px;background:rgba(255,255,255,.045);backdrop-filter:blur(18px);box-shadow:0 24px 80px rgba(0,0,0,.35)}.badge{display:inline-flex;align-items:center;gap:9px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);font-size:13px;color:#c9cce0}.dot{width:8px;height:8px;border-radius:50%;background:#5eead4;box-shadow:0 0 18px #5eead4;animation:pulse 1.8s ease-in-out infinite}h1{margin:28px 0 14px;font-size:clamp(42px,8vw,76px);line-height:1.08;letter-spacing:-2px}p{margin:0 auto;max-width:520px;color:#aeb3c7;font-size:clamp(16px,2.4vw,19px);line-height:2}.line{width:72px;height:3px;border-radius:99px;margin:30px auto 0;background:linear-gradient(90deg,#6f5cff,#29d3b4)}footer{position:absolute;bottom:24px;color:#686e84;font-size:12px}@keyframes pulse{50%{opacity:.45;transform:scale(.8)}}@media(max-width:600px){.page{padding:18px}.card{padding:48px 24px;border-radius:22px}h1{letter-spacing:-1px}}
</style>
</head>
<body><main class="page"><div class="glow" aria-hidden="true"></div><div class="glow two" aria-hidden="true"></div><section class="card" aria-labelledby="title"><div class="badge"><span class="dot"></span> در حال آماده‌سازی</div><h1 id="title">به‌زودی</h1><p>ما در حال ساختن چیزی تازه و متفاوت هستیم.<br>این صفحه به‌زودی با خبرهای خوب به‌روز می‌شود.</p><div class="line" aria-hidden="true"></div></section><footer>با دقت در حال ساخت</footer></main></body>
</html>
