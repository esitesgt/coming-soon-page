<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="این وب‌سایت به‌زودی راه‌اندازی می‌شود.">
<meta name="theme-color" content="#070914">
<title>به‌زودی | در دست ساخت</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');
:root{font-family:'Vazirmatn',Tahoma,sans-serif;color:#f8f9ff;background:#070914;color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow:hidden}body{min-height:100vh;background:radial-gradient(circle at 15% 20%,rgba(113,92,255,.18),transparent 32%),radial-gradient(circle at 85% 78%,rgba(45,212,191,.12),transparent 30%),#070914}.page{min-height:100vh;display:grid;place-items:center;position:relative;padding:24px}.stars{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.5) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,transparent,black 25%,black 75%,transparent);opacity:.14}.orb{position:absolute;border-radius:50%;filter:blur(2px);pointer-events:none}.orb.a{width:430px;height:430px;top:-180px;right:-120px;background:radial-gradient(circle,rgba(124,92,255,.35),transparent 68%)}.orb.b{width:380px;height:380px;bottom:-190px;left:-100px;background:radial-gradient(circle,rgba(45,212,191,.22),transparent 68%)}.card{position:relative;width:min(760px,100%);padding:72px 52px 64px;text-align:center;border:1px solid rgba(255,255,255,.12);border-radius:32px;background:linear-gradient(145deg,rgba(255,255,255,.085),rgba(255,255,255,.035));box-shadow:0 35px 100px rgba(0,0,0,.42),inset 0 1px rgba(255,255,255,.08);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);animation:rise .8s ease both}.card:before{content:'';position:absolute;inset:0;border-radius:32px;padding:1px;background:linear-gradient(135deg,rgba(124,92,255,.55),transparent 35%,rgba(45,212,191,.3));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}.brand{display:inline-flex;align-items:center;gap:10px;color:#cdd1e6;font-size:13px;font-weight:600;letter-spacing:.2px}.brand-mark{width:10px;height:10px;border-radius:50%;background:#5eead4;box-shadow:0 0 22px #5eead4}.badge{display:inline-flex;align-items:center;gap:8px;margin-top:26px;padding:8px 14px;border:1px solid rgba(255,255,255,.1);border-radius:999px;background:rgba(255,255,255,.055);color:#b9bfd6;font-size:12px}.badge i{width:7px;height:7px;border-radius:50%;background:#a78bfa;box-shadow:0 0 14px #a78bfa;animation:pulse 1.8s ease-in-out infinite}h1{margin:24px 0 16px;font-size:clamp(48px,9vw,88px);line-height:1;letter-spacing:-3px;font-weight:800;background:linear-gradient(110deg,#fff 25%,#c4b5fd 55%,#5eead4 90%);-webkit-background-clip:text;background-clip:text;color:transparent}p{margin:0 auto;max-width:560px;color:#aeb5cc;font-size:clamp(16px,2.4vw,20px);line-height:2.05}.progress{width:min(280px,70%);height:5px;margin:34px auto 0;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}.progress span{display:block;width:62%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#7c5cff,#5eead4);box-shadow:0 0 20px rgba(94,234,212,.45);animation:load 2.6s ease-in-out infinite alternate}.footer{position:absolute;bottom:20px;color:#656c83;font-size:11px}.footer span{color:#858ca2}@keyframes pulse{50%{opacity:.35;transform:scale(.75)}}@keyframes load{from{transform:translateX(8%)}to{transform:translateX(-55%)}}@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}@media(max-width:600px){.page{padding:16px}.card{padding:54px 24px 48px;border-radius:25px}.card:before{border-radius:25px}h1{letter-spacing:-2px}.footer{bottom:14px}}
</style>
</head>
<body>
<main class="page">
<div class="stars" aria-hidden="true"></div><div class="orb a" aria-hidden="true"></div><div class="orb b" aria-hidden="true"></div>
<section class="card" aria-labelledby="title">
<div class="brand"><span class="brand-mark"></span> یک تجربه‌ی تازه در راه است</div>
<div class="badge"><i></i> در حال آماده‌سازی</div>
<h1 id="title">به‌زودی</h1>
<p>ما مشغول ساختن چیزی متفاوت و جذاب هستیم.<br>کمی دیگر برمی‌گردیم؛ اینجا خبرهای خوبی در راه است.</p>
<div class="progress" aria-hidden="true"><span></span></div>
</section>
<div class="footer">با دقت و عشق در حال ساخت <span>✦</span></div>
</main>
</body>
</html>
